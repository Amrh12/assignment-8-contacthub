<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContactHub - Smart Contact Manager</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/all.min.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="app-header bg-white border-bottom">
    <div class="page-container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="icon-box logo-box bg-purple">
          <i class="fa-solid fa-address-book"></i>
        </div>
        <div>
          <h1 class="logo-title">Contact<span class="text-purple">Hub</span></h1>
          <p class="logo-subtitle">Smart Contact Manager</p>
        </div>
      </div>

      <div class="header-actions d-flex align-items-center">
        <button class="btn btn-purple" id="addContactBtn">
          <i class="fa-solid fa-plus me-2"></i>Add Contact
        </button>
        <i class="fa-solid fa-bell header-icon"></i>
        <i class="fa-solid fa-gear header-icon"></i>
        <img src="./images/avatar-2.jpg" class="header-avatar" alt="profile" />
      </div>
    </div>
  </header>

  <main class="page-container main-area">

    <!-- ===== Stats ===== -->
    <section class="stats-grid">
      <div class="card app-card stat-card">
        <div class="icon-box stat-icon grad-blue"><i class="fa-solid fa-users"></i></div>
        <div>
          <p class="stat-label">TOTAL</p>
          <h3 class="stat-number" id="totalCount">0</h3>
        </div>
      </div>

      <div class="card app-card stat-card">
        <div class="icon-box stat-icon grad-orange"><i class="fa-solid fa-star"></i></div>
        <div>
          <p class="stat-label">FAVORITES</p>
          <h3 class="stat-number" id="favoritesCount">0</h3>
        </div>
      </div>

      <div class="card app-card stat-card">
        <div class="icon-box stat-icon grad-red"><i class="fa-solid fa-heart-pulse"></i></div>
        <div>
          <p class="stat-label">EMERGENCY</p>
          <h3 class="stat-number" id="emergencyCount">0</h3>
        </div>
      </div>
    </section>

    <div class="content-grid">
      <!-- ===== All Contacts ===== -->
      <section>
        <h2 class="section-title">All Contacts</h2>
        <p class="section-subtitle">Manage and organize your <span id="contactsText">0</span> contacts</p>

        <div class="input-group search-group">
          <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Search by name, phone, or email..." />
        </div>

        <div class="row g-4" id="contactsContainer"></div>
      </section>

      <!-- ===== Side Lists ===== -->
      <aside>
        <div class="card app-card side-card">
          <div class="side-header side-yellow">
            <div class="icon-box side-icon grad-orange"><i class="fa-solid fa-star"></i></div>
            <div>
              <h4 class="side-title">Favorites</h4>
              <p class="side-sub">Quick access to starred contacts</p>
            </div>
          </div>
          <div class="side-body" id="favoritesList"></div>
        </div>

        <div class="card app-card side-card">
          <div class="side-header side-red">
            <div class="icon-box side-icon grad-red"><i class="fa-solid fa-heart-pulse"></i></div>
            <div>
              <h4 class="side-title">Emergency</h4>
              <p class="side-sub">Important contacts for urgent calls</p>
            </div>
          </div>
          <div class="side-body" id="emergencyList"></div>
        </div>
      </aside>
    </div>
  </main>

  <!-- ===== Add / Edit Modal ===== -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add New Contact</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <!-- Photo -->
          <div class="photo-block">
            <div class="icon-box photo-circle" id="photoPreview">
              <i class="fa-solid fa-user"></i>
            </div>
            <label for="photoInput" class="btn btn-photo">
              <i class="fa-solid fa-camera me-2"></i>Change Photo
            </label>
            <input type="file" id="photoInput" accept="image/*" hidden />
          </div>

          <div class="field">
            <label class="form-label">Full Name <span class="required">*</span></label>
            <input type="text" id="nameInput" class="form-control" placeholder="Enter full name" />
          </div>

          <div class="field">
            <label class="form-label">Phone Number <span class="required">*</span></label>
            <input type="text" id="phoneInput" class="form-control" placeholder="e.g., 01012345678" />
          </div>

          <div class="field">
            <label class="form-label">Email Address</label>
            <input type="text" id="emailInput" class="form-control" placeholder="name@example.com" />
          </div>

          <div class="field">
            <label class="form-label">Address</label>
            <input type="text" id="addressInput" class="form-control" placeholder="Enter address" />
          </div>

          <div class="field">
            <label class="form-label">Group</label>
            <select id="groupInput" class="form-select">
              <option value="">Select a group</option>
              <option value="Family">Family</option>
              <option value="Friends">Friends</option>
              <option value="Work">Work</option>
              <option value="School">School</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label class="form-label">Notes</label>
            <textarea id="notesInput" class="form-control" rows="2" placeholder="Add notes about this contact"></textarea>
          </div>

          <div class="d-flex gap-4 mt-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="favoriteInput" />
              <label class="form-check-label" for="favoriteInput"><i class="fa-solid fa-star star-color"></i> Favorite</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="emergencyInput" />
              <label class="form-check-label" for="emergencyInput"><i class="fa-solid fa-heart-pulse heart-color"></i> Emergency</label>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-cancel" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-purple btn-save" id="saveContactBtn">
            <i class="fa-solid fa-check me-2"></i>Save Contact
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/sweetalert2.all.min.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
